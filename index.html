<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance - Josesoft</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:#0a0a0b;
    color:#e8e8e8;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:absolute;
    width:800px;height:800px;
    background:radial-gradient(circle at center, rgba(255,107,0,0.12) 0%, transparent 70%);
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .card{
    width:100%;
    max-width:520px;
    background:rgba(22,22,24,0.8);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:48px 40px;
    backdrop-filter:blur(16px);
    position:relative;
    z-index:1;
    text-align:center;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,107,0,0.12);
    border:1px solid rgba(255,107,0,0.25);
    color:#ff8c3a;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:28px;
  }
  .dot{
    width:8px;height:8px;
    background:#ff6b00;
    border-radius:50%;
    box-shadow:0 0 12px #ff6b00;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(0.9)}}
  h1{
    font-size:34px;
    line-height:1.1;
    font-weight:700;
    letter-spacing:-0.03em;
    margin-bottom:16px;
    color:#fff;
  }
  h1 span{color:#ff6b00}
  p{
    font-size:15px;
    line-height:1.6;
    color:#9a9aa0;
    margin-bottom:32px;
  }
  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin:32px 0;
  }
  .contact{
    font-size:13px;
    color:#6a6a70;
  }
  .contact a{
    color:#e8e8e8;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.15);
    transition:all .2s;
  }
  .contact a:hover{color:#ff6b00;border-color:#ff6b00}
  .logo{
    margin-top:32px;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#3a3a3e;
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> Maintenance Mode</div>
    <h1>We're currently<br><span>under maintenance</span></h1>
    <p>
      We're making some improvements to <strong style="color:#fff;">JoseCast Suite</strong> and our website.
      We'll be back online shortly. Thank you for your patience.
    </p>
    <div class="divider"></div>
    <div class="contact">
      If you need urgent assistance, please contact us at<br>
      <a href="mailto:contact@josesoft.com">contact@josesoft.com</a>
    </div>
    <div class="logo">Josesoft © 2026</div>
  </div>
</body>
</html>
